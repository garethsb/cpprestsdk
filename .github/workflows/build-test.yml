name: Build and Test

on:
  push:
    branches: [cpprest-lts]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: ${{ matrix.os }} ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev zlib1g-dev libwebsocketpp-dev \
            libboost-atomic-dev libboost-chrono-dev libboost-date-time-dev libboost-filesystem-dev \
            libboost-random-dev libboost-regex-dev libboost-system-dev libboost-thread-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -LE badssl

      - name: Test with badssl.com
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure -L badssl

  clang:
    name: ubuntu-26.04 Clang C++23 ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libssl-dev zlib1g-dev libwebsocketpp-dev \
            libboost-atomic-dev libboost-chrono-dev libboost-date-time-dev libboost-filesystem-dev \
            libboost-random-dev libboost-regex-dev libboost-system-dev libboost-thread-dev

      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_STANDARD=23

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -LE badssl

      - name: Test with badssl.com
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure -L badssl

  macos:
    name: ${{ matrix.os }} ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      # Two jobs rather than the full matrix, because GitHub warns that "Due to capacity constraints,
      # jobs targeting macOS arm64 runners may experience longer queue times."
      matrix:
        include:
          - os: macos-15
            build_type: Release
          - os: macos-26
            build_type: Debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install ninja boost openssl@3

      # Homebrew's websocketpp is 0.8.2, which does not build with Boost 1.87 or later
      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          -DCPPREST_EXCLUDE_WEBSOCKETS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -LE badssl

      - name: Test with badssl.com
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure -L badssl

  windows:
    name: ${{ matrix.os }} ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, windows-2022]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows'

      # vcpkg no longer has a websocketpp port, and websocketpp 0.8.2 does not build with Boost 1.87 or later
      - name: Configure
        run: >-
          cmake -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DCPPREST_EXCLUDE_WEBSOCKETS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure -LE badssl

      - name: Test with badssl.com
        continue-on-error: true
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure -L badssl
